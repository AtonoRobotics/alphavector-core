name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: images
          key: alpine-minirootfs-3.20.3
      # Host X tools the per-agent desktop already assumes (not the Alpine image).
      # xsetroot is x11-xserver-utils; xmessage is x11-utils on ubuntu-latest.
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils x11-utils x11-apps x11vnc scrot iptables iproute2
      # ubuntu-latest (24.04) blocks unprivileged user namespaces by default.
      # The Alpine/unshare computer needs them; this does not weaken secrets or egress.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --map-root-user --mount --net -- true
          command -v xsetroot
          command -v xmessage
          command -v Xvfb
          command -v scrot
      - run: npm install
      - run: npm run prepare:image
      - run: npm test
      - run: npm run build

  field-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Field schemes
        working-directory: clients/field-ios
        run: |
          xcodebuild -version
          xcodebuild -project Field.xcodeproj -list
      - name: Compile Field iOS (unsigned)
        working-directory: clients/field-ios
        run: |
          xcodebuild \
            -project Field.xcodeproj \
            -scheme Field \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload Field.app
        uses: actions/upload-artifact@v4
        with:
          name: field-ios
          path: clients/field-ios/build/Build/Products/Debug-iphonesimulator/Field.app
