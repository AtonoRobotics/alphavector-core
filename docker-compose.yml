services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: avdev
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - av-postgres:/var/lib/postgresql/data

  computer-image:
    image: llc.alphavector.dev/computer:0.1.0
    build:
      context: ./computer/image
      dockerfile: Dockerfile
    profiles: ["build"]

volumes:
  av-postgres:
